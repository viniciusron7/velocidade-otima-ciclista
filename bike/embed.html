<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cyclist embed</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* Embedding overrides — keep style.css untouched, just tweak here */
    html, body {
      margin: 0;
      padding: 0;
      width: 600px;
      height: 600px;
      background: transparent;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bike-riding {
      background: transparent !important;
      width: 600px;
      height: 600px;
      position: relative;
      overflow: visible;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Remove decorative scene elements that don't belong in the embed */
    .clouds,
    .shadow,
    .spokes,
    .leftTyre::before,
    .rightTyre::before,
    .leftTyre::after,
    .rightTyre::after {
      display: none !important;
    }

    /* Strip the white sneaker sole — it looked like a "white blade" inside the wheel */
    .calf::before,
    .leftcalf::before {
      box-shadow: none !important;
    }

    /* Wheel rotation is now driven by JS from the parent page (rolling-
       without-slipping sync). Disable the original 1s spin animation. */
    .leftTyre,
    .rightTyre {
      animation: none !important;
    }
  </style>
</head>
<body>
  <div class="bike-riding">
    <div class="cyclist">
      <div class="bike">
        <div class="leftTyre"></div>
        <div class="rightTyre"></div>
        <div class="wheel"></div>
        <div class="pedals"></div>
        <div class="chain"></div>
      </div>
      <div class="girl">
        <div class="top"></div>
        <div class="rightArm"></div>
        <div class="leftArm"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="strap"></div>
        <div class="trousers">
          <div class="leftLeg"><div class="leftcalf"></div></div>
          <div class="rightLeg"><div class="calf"></div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
